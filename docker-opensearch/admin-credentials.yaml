# OpenSearch admin credentials.
#
# The Jenkins job takes this as a build PARAMETER
# (params.OPENSEARCH_INITIAL_ADMIN_PASSWORD), not a stored credential, so before
# this file the only copy lived in a gitignored .env on one laptop -- outside
# git, outside any backup. Losing that laptop meant losing administrative access
# to OpenSearch, which is not hypothetical: on 2026-09-10 the .env still held a
# stale value and the working password had to be hunted down by hand.
#
# Note this is NOT what OPENSEARCH_INITIAL_ADMIN_PASSWORD sets on a running
# cluster. That variable only applies at first initialisation; afterwards the
# password lives in the .opendistro_security index and can drift from it, which
# is exactly what had happened.
#
# The matching bcrypt hash is in
# config/opensearch-security/internal_users.yml, also encrypted.
