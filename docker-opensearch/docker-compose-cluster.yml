version: "3.8"

# NOTE: Before deploying this cluster, update opensearch.yml (mounted via opensearch-conf volume) to remove
# the "discovery.type: single-node" line — it conflicts with multi-node cluster discovery.

services:
  opensearch-node1:
    image: opensearchproject/opensearch:2.19.5
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - "node.role==worker"
          # - "node.labels.os_node==1"
    env_file:
      - .env
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1G -Xmx1G"
      - "DISABLE_SECURITY_PLUGIN=false"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # ports:
    #   - target: 9200
    #     published: 9200
    #     mode: host
    networks:
      - opensearch-net
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
      - opensearch-conf:/usr/share/opensearch/config

  opensearch-node2:
    image: opensearchproject/opensearch:2.19.5
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - "node.role==worker"
          # - "node.labels.os_node==2"
    env_file:
      - .env
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1G -Xmx1G"
      - "DISABLE_SECURITY_PLUGIN=false"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - opensearch-net
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
      - opensearch-conf:/usr/share/opensearch/config

  opensearch-proxy:
    image: haproxy:alpine
    deploy:
      placement:
        constraints:
          - "node.role==manager"
    ports:
      - "9200:9200"
    configs:
      - source: haproxy_opensearch_v${CONF_VERSION}
        target: /usr/local/etc/haproxy/haproxy.cfg
    networks:
      - opensearch-net

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.5
    deploy:
      placement:
        constraints:
          - "node.role==worker"
    ports:
      - 5601:5601
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch-node1:9200","https://opensearch-node2:9200"]
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
      - SERVER_SSL_ENABLED=false
    networks:
      - opensearch-net

volumes:
  opensearch-data1:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/opensearch_data"
  opensearch-data2:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/opensearch_data2"
  opensearch-conf:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/opensearch_config"

configs:
  haproxy_opensearch_v${CONF_VERSION}:
    file: ./config/haproxy-opensearch.cfg

networks:
  opensearch-net:
