global
    log stdout format raw local0

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold obsolete   10s

defaults
    mode    tcp
    log     global
    timeout connect 10s
    timeout client  60s
    timeout server  120s

frontend opensearch_front
    bind *:9200
    default_backend opensearch_back

backend opensearch_back
    balance     roundrobin
    server      node1 opensearch-node1:9200 check resolvers docker resolve-prefer ipv4 init-addr none
    server      node2 opensearch-node2:9200 check resolvers docker resolve-prefer ipv4 init-addr none
