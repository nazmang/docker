# Lints every Dockerfile in the repo with hadolint.
#
# Fixed 2026-09-29. Until then this workflow never linted anything and still
# blocked every PR:
#   - GitHub had disabled it for inactivity (and gitleaks.yml with it), so the
#     required status check "Run hadolint scanning" never reported and every
#     merge to master needed an admin bypass;
#   - `push: branches: ["*"]` does not match branch names containing "/"
#     (monitoring/..., fix/...), and there was no pull_request trigger;
#   - the Dockerfile existence check only looked one directory deep, so the
#     lint step was `skipped` on every run;
#   - a Gitleaks step was bolted onto this job and was what actually failed
#     (it had found a real, live password -- see .gitleaksignore). Secret
#     scanning lives in gitleaks.yml only.
#
# The job name is the required status check on master; do not rename it.
name: Hadolint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "45 15 * * 6"

permissions:
  contents: read

jobs:
  hadolint:
    name: Run hadolint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          recursive: true
          # Warnings (unpinned apk/gem versions, CMD notation) are reported but
          # do not fail the check; only errors do. Both Dockerfiles pass at
          # this threshold as of 2026-09-29.
          failure-threshold: error
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload analysis results to GitHub
        if: always() && hashFiles('hadolint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results.sarif
