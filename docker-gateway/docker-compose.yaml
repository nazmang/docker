version: "3.8"

services:
  gateway:
    image: "jc21/nginx-proxy-manager:${NGINX_PXY_MANAGER_TAG:-latest}"
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      DISABLE_IPV6: 'true'
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt
    networks:
      - gw_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.platform.arch==x86_64
          - node.role == manager
          # - node.labels.location == cloud

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    # --region us: only US edges. 15.10.2026 11:16-11:33 two of four
    # connections sat on dme05 (Moscow) while Russian DCs were down; Cloudflare
    # answered 1033 for the whole tunnel until the edge closed them ~15 min
    # later and cloudflared moved to ams*. The night 502s fit the same pattern.
    # "us" is the only region cloudflared has besides global; the cost is
    # ~100 ms more to admin UIs (zbx, grafana, portainer, proxymgr, prom).
    command: tunnel run --protocol http2 --region us
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gw_net

networks:
  gw_net:
    attachable: true
    driver: overlay

volumes:
  data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "${NGINXP_DATA_PATH}"
  letsencrypt:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "${NGINXP_LETSENCRYPT_PATH}"