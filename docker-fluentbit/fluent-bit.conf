[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

# --- Common syslog ---
[INPUT]
    Name   syslog
    Listen 0.0.0.0
    Port   514
    Mode   udp
    Parser syslog-rfc3164
    Tag    syslog.general

# --- Devices without an ident (RouterOS) get ident=device: the syslog output
# below needs an appname, and Wazuh matches RouterOS by program_name device ---
[FILTER]
    Name      modify
    Match     syslog.general
    Condition Key_does_not_exist ident
    Add       ident device

# --- Separate filter  for nginx ---
[FILTER]
    Name    rewrite_tag
    Match   syslog.general
    Rule    ident ^nginx_access$ nginx.access true

[FILTER]
    Name    rewrite_tag
    Match   syslog.general
    Rule    ident ^nginx_error$ nginx.error true

[FILTER]
    Name    parser
    Match   nginx.access
    Key_Name message
    Parser  nginx_access

[FILTER]
    Name    parser
    Match   nginx.error
    Key_Name message
    Parser  nginx_error

# --- Output Fluentd ---
[OUTPUT]
    Name   forward
    Match  *
    Host   10.163.11.105
    Port   24224

# --- Copy of all syslog to Wazuh (wazuh01) for security rules: brute force,
# logins, config changes on MikroTik. Decoders/rules live on wazuh01
# (etc/decoders/routeros_decoders.xml, etc/rules/routeros_rules.xml), 16.10.2026 ---
[OUTPUT]
    Name                   syslog
    Match                  syslog.general
    Host                   10.163.11.108
    Port                   514
    Mode                   udp
    Syslog_Format          rfc3164
    Syslog_Hostname_Key    host
    Syslog_Appname_Key     ident
    Syslog_Message_Key     message
    Syslog_Severity_Preset 6
    Syslog_Facility_Preset 16
