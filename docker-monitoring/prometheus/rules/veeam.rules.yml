###############################################################################
# Veeam Agent on psvc.duckdns.org.
#
# These rules exist because of a specific failure, and they are shaped by it.
#
# On 2026-09-11 that host's nightly job reported Success while logging, on every
# run for at least five days, "Backup metadata is in inconsistent state" and
# "Unable to decrypt archive key ... archive recovery key ... is missing from
# archive key node" -- and the Veeam UI could not see the backup chain at all,
# although the .vbk/.vib files were on the storage box. A check that asked "did
# the job succeed?" would have said yes throughout.
#
# So: three independent signals, because any one of them can look healthy while
# the others do not. Metrics come from veeam-metrics.ps1 through
# windows_exporter's textfile collector.
###############################################################################
groups:

- name: veeam_backups
  rules:

  - alert: VeeamJobFailed
    # Only a verdict actually read from the log: a non-zero finish timestamp.
    # result=2 with timestamp 0 means "no verdict found", not "failed" -- on
    # 2026-11-13 that state fired this rule as critical at 01:56, at night, on
    # a run that finished Success at 02:45. Unknown has its own rule below.
    expr: (veeam_job_last_result != 0) and on(job_name) (veeam_job_last_finish_timestamp_seconds > 0)
    for: 15m
    labels:
      severity: critical
      category: backup
      team: platform
    annotations:
      summary: "Задание Veeam {{ $labels.job_name }} завершилось неуспешно"
      description: "Последний запуск вернул код {{ $value }} (0 — успех, 1 — с предупреждениями, 2 — отказ либо результат не удалось определить)."

  - alert: VeeamJobStale
    # The job runs at 00:30. Twenty-six hours means one missed night is reported
    # and not two.
    # Timestamp 0 is "no verdict found" and belongs to VeeamJobVerdictUnknown;
    # here it read as "56 years stale".
    expr: (time() - veeam_job_last_finish_timestamp_seconds > 26 * 3600) and on(job_name) (veeam_job_last_finish_timestamp_seconds > 0)
    for: 30m
    labels:
      severity: critical
      category: backup
      team: platform
    annotations:
      summary: "Задание Veeam {{ $labels.job_name }} не отрабатывало более суток"
      description: "Последнее завершение — {{ $value | humanizeDuration }} назад."

  - alert: VeeamJobVerdictUnknown
    # The collector found no completed session in any retained log. Not a
    # success either -- so it still alerts, but as a warning, and not while a
    # run is in progress (a run in progress is the normal reason, see
    # veeam-metrics.ps1). `unless` against an absent veeam_job_running keeps
    # the rule working with a collector older than that metric.
    expr: (veeam_job_last_finish_timestamp_seconds == 0) unless on(job_name) (veeam_job_running == 1)
    for: 2h
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "Veeam {{ $labels.job_name }}: в журналах нет итога ни одного запуска"
      description: "Сборщик не нашёл строку о завершении сессии ни в текущем, ни в ротированных журналах. Это не провал и не успех — проверить итог в консоли Veeam на psvc."

  - alert: VeeamJobVerdictUnknown
    # The same state a day on is no longer a quirk of log rotation: there has
    # been no provable backup for over a day. Same weight as VeeamJobStale.
    expr: (veeam_job_last_finish_timestamp_seconds == 0) unless on(job_name) (veeam_job_running == 1)
    for: 26h
    labels:
      severity: critical
      category: backup
      team: platform
    annotations:
      summary: "Veeam {{ $labels.job_name }}: больше суток нет подтверждённого бэкапа"
      description: "Итог запуска не найден в журналах уже 26 часов. Проверить задание в консоли Veeam на psvc."

  - alert: VeeamJobRunningTooLong
    # Usual run is about an hour; 2h15m on 2026-11-13 is the longest seen.
    # Five hours means it is stuck or the upload has degraded badly -- worth a
    # look in the morning, not a wake-up.
    expr: (time() - veeam_job_running_since_timestamp_seconds > 5 * 3600) and on(job_name) (veeam_job_running_since_timestamp_seconds > 0) and on(job_name) (veeam_job_running == 1)
    for: 15m
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "Veeam {{ $labels.job_name }} идёт дольше 5 часов"
      description: "Запуск начат {{ $value | humanizeDuration }} назад и не завершился. Обычно — около часа."

  - alert: VeeamEncryptionKeyErrors
    # THE RULE THIS FILE EXISTS FOR. It fires while the job is green, because
    # that is exactly the state that fooled everyone: data written nightly,
    # Success reported, and key material the product itself cannot resolve.
    expr: veeam_job_key_errors > 0
    for: 1h
    labels:
      severity: critical
      category: backup
      team: platform
    annotations:
      summary: "Veeam {{ $labels.job_name }}: ошибки ключей шифрования при успешном задании"
      description: "В журнале {{ $value }} записей о несогласованных метаданных или недоступном ключе архива. Задание при этом отчитывается об успехе — восстановимость копий под вопросом, пока не проверена расшифровкой."

  - alert: VeeamServiceNotRunning
    # The "quiet stop" threat, watched by state rather than by audit trail --
    # because that host records no object-access auditing at all: stopping the
    # service or disabling the job leaves no trace anywhere. Eight principals
    # can do it, including the 1C service account, which is why this is a
    # monitoring problem and not only a permissions one.
    expr: windows_service_state{name="veeamendpointbackupsvc",state="running"} == 0
    for: 15m
    labels:
      severity: critical
      category: backup
      team: platform
    annotations:
      summary: "Служба Veeam Agent не запущена"
      description: "VeeamEndpointBackupSvc не в состоянии running. Пока она остановлена, резервное копирование не выполняется и об этом ничто больше не сообщит."

  - alert: VeeamServiceNotAutomatic
    # A service left on Manual survives until the next reboot and then never
    # comes back. The job simply stops running, quietly, exactly like the case
    # above but delayed by however long the machine stays up.
    expr: windows_service_start_mode{name="veeamendpointbackupsvc",start_mode="auto"} == 0
    for: 1h
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "Служба Veeam Agent не в автозапуске"
      description: "Тип запуска отличается от автоматического — после следующей перезагрузки резервное копирование не возобновится."

  - alert: VeeamCollectorDown
    # The collector reports its own failure rather than going quiet, because a
    # collector that dies silently leaves every rule above evaluating nothing
    # and looking calm.
    expr: veeam_collector_up == 0
    for: 1h
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "Сборщик метрик Veeam не смог прочитать журналы"
      description: "Скрипт отработал, но данные собрать не удалось — смотрите veeam_collector_error_info."

  - alert: VeeamMetricsMissing
    expr: absent(veeam_collector_up)
    for: 2h
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "Метрики Veeam пропали полностью"
      description: "Ни одной серии veeam_collector_up. Либо не выполняется запланированная задача, либо windows_exporter не читает textfile-каталог, либо недоступен сам хост."
