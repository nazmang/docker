# NOTE (2026-09-10): severities here were `page` and `email`, which the
# ntfy-alertmanager bridge does not map -- `page` was not in its label table at
# all, so PostgreSQLDown and the other three most serious rules arrived at
# ntfy's default priority, indistinguishable from a warning. Everything now
# uses the critical/warning taxonomy the rest of this directory and the
# Kubernetes side already use.
groups:
  - name: PostgreSQL
    rules:
      # === CONNECTIONS ===
      - alert: PostgreSQLMaxConnectionsReached
        expr: sum(pg_stat_activity_count) by (instance) >= sum(pg_settings_max_connections) by (instance) - sum(pg_settings_superuser_reserved_connections) by (instance)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has maxed out Postgres connections."
          description: "Current connections: {{ $value }}. Services may be degraded. Consider increasing max_connections and redeploying."

      - alert: PostgreSQLHighConnections
        expr: sum(pg_stat_activity_count) by (instance) > (sum(pg_settings_max_connections) by (instance) - sum(pg_settings_superuser_reserved_connections) by (instance)) * 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is over 80% of max Postgres connections."
          description: "Current connections: {{ $value }}. Check utilization to determine if normal growth or if limits need adjustment."

      # === POSTGRES STATUS ===
      - alert: PostgreSQLDown
        expr: sum(pg_up) by (instance) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down: {{ $labels.instance }}"
          description: "No Postgres instance is responding on {{ $labels.instance }}. Immediate action required."

      # === LONG RUNNING TRANSACTIONS ===
      - alert: PostgreSQLLongRunningTransactions
        expr: max(pg_stat_activity_max_tx_duration{datname!~"template.*"}) by (datname) > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Long running transactions detected on {{ $labels.cluster }} for database {{ $labels.datname }}"
          description: "Transaction running longer than 5 minutes (current value: {{ $value }}s). Check queries and locks."

      # === DEADLOCKS ===
      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected on {{ $labels.cluster }} for database {{ $labels.datname }}"
          description: "Deadlocks occurred in the last 5 minutes (value: {{ $value }}). Investigate query patterns and locking issues."

      # === REPLICATION LAG ===
      - alert: PostgreSQLReplicationLag
        # Was `pg_last_xact_replay_timestamp > 30`. That metric does not exist
        # in this exporter, and comparing a unix timestamp against 30 seconds
        # would not have meant anything if it did -- the rule was critical and
        # unfireable. The is_replica guard is what makes the new version
        # correct rather than merely quiet: on this standalone instance it
        # evaluates to nothing, and it starts working by itself if a replica is
        # ever added.
        expr: |
          pg_replication_lag_seconds > 30
          and on(instance) pg_replication_is_replica == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replication lag on {{ $labels.cluster }} replica {{ $labels.instance }}"
          description: "Replica is lagging more than 30 seconds. Current lag: {{ $value }}s. Services may read stale data."

      # === AUTOVACUUM / DEAD TUPLES ===
      - alert: PostgreSQLTableBloat
        # A count of dead tuples means nothing without the size of the table it
        # sits in. The threshold used to be an absolute 100000, and raising
        # `for` to 6h did not help: it simply fired continuously anyway, because
        # on Zabbix's history tables that number is ordinary weather.
        #
        # Measured on this server 2026-09-11, while the alert was firing:
        #
        #   table          dead      live   ratio
        #   history        4.17M    25.2M   14.2%
        #   history_uint   2.54M    34.9M    6.8%
        #   history_str     114k     683k   14.3%
        #   trends_uint     137k     970k   12.3%
        #
        # autovacuum is enabled, has run 34-51 times on each of these, and acts
        # at autovacuum_vacuum_scale_factor = 0.2. Every one of them is below
        # that, so autovacuum was correct not to intervene and nothing was
        # wrong. The alert was reporting normal operation as a fault.
        #
        # So: the ratio, above the scale factor autovacuum itself uses. Staying
        # over 25% means autovacuum has had its chance and is not keeping up --
        # which is the only thing this alert can usefully say.
        #
        # The absolute floor stays, as the second half of an `and` rather than
        # the whole test. Without it this fires on tiny high-churn tables:
        # sessions, task_acknowledge, ha_node and token all sit at 94-100% dead
        # on a few hundred rows, which is equally normal and equally not news.
        expr: |
          100 * pg_stat_user_tables_n_dead_tup{datname!~"template.*"}
            / clamp_min(
                pg_stat_user_tables_n_dead_tup{datname!~"template.*"}
                + pg_stat_user_tables_n_live_tup{datname!~"template.*"}, 1) > 25
          and
          pg_stat_user_tables_n_dead_tup{datname!~"template.*"} > 500000
        for: 6h
        labels:
          severity: warning
        annotations:
          # Was {{ $labels.cluster }}, a label these series do not carry, so
          # every notification read "dead tuples on  for database zabbix" with
          # the gap where the table name should have been.
          summary: "Раздувание таблицы {{ $labels.schemaname }}.{{ $labels.relname }} в базе {{ $labels.datname }}"
          description: "Мёртвых строк {{ $value | printf \"%.1f\" }}% от общего числа, и так уже 6 часов. autovacuum срабатывает при 20%, значит он не справляется. Проверьте, не держит ли долгая транзакция горизонт очистки: SELECT * FROM pg_stat_activity WHERE state <> 'idle' ORDER BY xact_start;"

      # === DISK / WAL ===
      - alert: PostgreSQLWALDiskUsage
        # Neither pg_wal_total_bytes nor pg_wal_size_limit_bytes exists in this
        # exporter; the real names are below, so this rule could not fire
        # either. Downgraded from critical while fixing it: max_wal_size is a
        # checkpoint target, not a hard ceiling, and exceeding it under write
        # load is normal rather than an outage. Actually filling the filesystem
        # is caught by HighDiskUsage* on the host.
        expr: (pg_wal_size_bytes / pg_settings_max_wal_size_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL WAL disk usage high on {{ $labels.instance }}"
          description: "WAL usage is above 90% ({{ $value }}). Consider adding storage or adjusting checkpoint settings."

      # === QPS / THROUGHPUT SPIKE ===
      - alert: PostgreSQLQPSSpike
        expr: (
                avg(irate(pg_stat_database_xact_commit{datname!~"template.*"}[5m]) 
                  + irate(pg_stat_database_xact_rollback{datname!~"template.*"}[5m])) by (datname)
              )
              > 
              (
                avg(irate(pg_stat_database_xact_commit{datname!~"template.*"}[1h]) 
                  + irate(pg_stat_database_xact_rollback{datname!~"template.*"}[1h])) by (datname)
              ) * 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL query per second spike on {{ $labels.cluster }} for database {{ $labels.datname }}"
          description: "Current QPS ({{ $value }}) is more than 2x the 1h average. Investigate workload changes."

      # === OPTIONAL: CACHE HIT RATIO ===
      - alert: PostgreSQLCacheHitRatioLow
        expr: avg(
                rate(pg_stat_database_blks_hit{datname!~"template.*"}[5m])
                / 
                (rate(pg_stat_database_blks_hit{datname!~"template.*"}[5m])
                + rate(pg_stat_database_blks_read{datname!~"template.*"}[5m]))
              ) by (datname) < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate on {{ $labels.cluster }} for database {{ $labels.datname }}"
          description: "Cache hit ratio below 95% ({{ $value }}). May indicate inadequate shared_buffers or cold cache."
