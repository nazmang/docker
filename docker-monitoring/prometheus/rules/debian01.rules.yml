###############################################################################
# debian01 — домашний NAS (OpenMediaVault 7) с пулом ZFS и Home Assistant.
#
# Метрики приходят через remote_write от агента на самой машине: она за NAT,
# опросить её снаружи нельзя. Из этого следует важное для правил ниже: если
# метрики пропали, это НЕ значит, что машина цела и просто молчит — это может
# значить что угодно, от выключенного хоста до пропавшего интернета. Поэтому
# отсутствие данных здесь само по себе повод для тревоги, а параллельно за тем
# же следит push-монитор Uptime Kuma по независимому пути.
###############################################################################
groups:

- name: debian01
  rules:

  - alert: Debian01MetricsMissing
    expr: absent(up{host="debian01"})
    for: 20m
    labels:
      severity: warning
      category: availability
      team: platform
    annotations:
      summary: "debian01 перестал присылать метрики"
      description: "Более 20 минут нет ни одной серии с host=debian01. Хост выключен, пропала связь, или остановился агент. Push-монитор в Kuma должен сказать то же самое независимо."

  - alert: Debian01NodeExporterDown
    # The agent is alive (it is pushing) but cannot scrape the host's own
    # exporter — a different fault from the host being gone, and invisible
    # without this rule because the push keeps arriving.
    expr: up{host="debian01"} == 0
    for: 15m
    labels:
      severity: warning
      category: availability
      team: platform
    annotations:
      summary: "debian01: агент не может опросить node-exporter"
      description: "Метрики приходят, но локальный сбор не работает — проверьте prometheus-node-exporter на хосте."

  - alert: Debian01ZfsPoolNotImported
    # The failure this whole exercise started from: after a power cut the USB
    # enclosure returns, the boot-time import has already failed, and the pool
    # simply is not there. Last time that went unnoticed for five days.
    expr: zfs_pool_imported{host="debian01"} == 0
    for: 10m
    labels:
      severity: critical
      category: storage
      team: platform
    annotations:
      summary: "Пул {{ $labels.pool }} не импортирован на debian01"
      description: "Данных на нём сейчас нет. Проверьте питание внешней коробки: импорт по появлению диска настроен, поэтому включение должно поднять пул само."

  - alert: Debian01ZfsPoolUnhealthy
    expr: zfs_pool_healthy{host="debian01"} == 0 and zfs_pool_imported{host="debian01"} == 1
    for: 10m
    labels:
      severity: critical
      category: storage
      team: platform
    annotations:
      summary: "Пул {{ $labels.pool }} не в состоянии ONLINE"
      description: "Пул импортирован, но деградировал. Это один диск без избыточности — исправлять повреждение нечем, поэтому важно узнать рано."

  - alert: Debian01ZfsPoolErrors
    expr: zfs_pool_errors{host="debian01"} > 0
    for: 30m
    labels:
      severity: critical
      category: storage
      team: platform
    annotations:
      summary: "На пуле {{ $labels.pool }} {{ $value }} ошибок"
      description: "Ошибки чтения, записи или контрольных сумм. На пуле без избыточности ZFS обнаруживает повреждение, но не восстанавливает его."

  - alert: Debian01ZfsPoolFull
    expr: zfs_pool_capacity_percent{host="debian01"} > 90
    for: 1h
    labels:
      severity: warning
      category: storage
      team: platform
    annotations:
      summary: "Пул {{ $labels.pool }} заполнен на {{ $value }}%"
      description: "ZFS заметно теряет производительность выше 90% и почти не умеет освобождать место без удаления снимков."

  - alert: Debian01SmartFailure
    expr: smart_healthy{host="debian01"} == 0
    for: 15m
    labels:
      severity: critical
      category: storage
      team: platform
    annotations:
      summary: "S.M.A.R.T. на {{ $labels.device }} сообщает о проблеме"
      description: "Диск сам заявляет о неисправности. На машине без избыточности это повод копировать данные, а не разбираться не спеша."

  - alert: Debian01RootFilesystemFilling
    # Measured at 88% the day this was written, on a 33 GB root shared with
    # Home Assistant, which writes constantly.
    expr: root_filesystem_used_percent{host="debian01"} > 92
    for: 30m
    labels:
      severity: warning
      category: resource
      team: platform
    annotations:
      summary: "Корневая ФС debian01 заполнена на {{ $value }}%"
      description: "Home Assistant пишет непрерывно; при переполнении корня встанут и он, и OMV."

  - alert: Debian01HomeAssistantDown
    expr: home_assistant_up{host="debian01"} == 0
    for: 15m
    labels:
      severity: warning
      category: availability
      team: platform
    annotations:
      summary: "Home Assistant не отвечает"
      description: "Порт 8123 не отдаёт ответ. Умный дом стоит: сценарии, датчики и Zigbee-устройства не обслуживаются."

###############################################################################
# Резервные копии borg на debian01.
#
# omv-backup запускается еженедельно (воскресенье 00:00) и пишет архивы borg на
# пул. До 2026-09-11 за ним не следило ничто. Обнаружилось: последняя успешная
# копия — 9 августа, запуск 6 сентября упал, а всё это время задание считалось
# работающим. Отчёты cron уходили в почту root, которая пуста и никем не
# читается.
#
# Причина отказа тоже показательна: пул ZFS не был импортирован, и borg создал
# новый репозиторий в каталоге точки монтирования на корневой ФС. Правила ниже
# такой случай ловят — репозиторий на пуле перестаёт обновляться, и возраст
# последней успешной копии растёт, независимо от того, куда именно писал borg.
#
# Метрики приходят из host-health.sh через textfile-коллектор node-exporter.
###############################################################################

- name: debian01_backups
  rules:

  - alert: BorgBackupFailed
    # Прогон завершился ошибкой. Ждём 30 минут: следующий запуск раньше не
    # случится, а дребезга здесь быть не может — метрика меняется раз в неделю.
    expr: borg_backup_last_result{host="debian01"} == 0
    for: 30m
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "debian01: последний запуск резервного копирования завершился ошибкой"
      description: "omv-backup отработал с ошибкой. Подробности в /var/log/omv-backup.log; строка с ERROR: содержит причину. Сам borg пишет в stderr, который omv-backup не перехватывает — при неясной причине запускать /usr/sbin/omv-backup вручную."

  - alert: BorgBackupTooOld
    # Расписание недельное, порог 8 суток — один пропущенный запуск плюс сутки
    # запаса. Два пропуска подряд уже означают, что восстанавливать нечего.
    expr: time() - borg_backup_last_success_timestamp_seconds{host="debian01"} > 8 * 24 * 3600
    for: 1h
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "debian01: резервной копии нет больше недели"
      description: "Последняя успешная копия сделана {{ $value | humanizeDuration }} назад при недельном расписании. Пропущен как минимум один запуск."

  - alert: BorgBackupVeryOld
    expr: time() - borg_backup_last_success_timestamp_seconds{host="debian01"} > 16 * 24 * 3600
    for: 1h
    labels:
      severity: critical
      category: backup
      team: platform
    annotations:
      summary: "debian01: резервной копии нет больше двух недель"
      description: "Пропущено два запуска подряд и более. Восстанавливать конфигурацию хоста, Home Assistant и docker-стеки сейчас не из чего — на пуле лежат данные, но не система."

  - alert: BorgBackupMetricsMissing
    # Ловит то, чего не видит порог по возрасту: серия исчезла целиком, и
    # выражение выше просто перестаёт вычисляться. Тишина неотличима от нормы.
    expr: absent(borg_backup_last_success_timestamp_seconds{host="debian01"})
    for: 2h
    labels:
      severity: warning
      category: backup
      team: platform
    annotations:
      summary: "debian01: метрика о резервных копиях пропала"
      description: "Нет ни одной серии borg_backup_last_success_timestamp_seconds. Либо host-health.sh не запускается, либо /var/log/omv-backup.log стал нечитаем, либо node-exporter потерял textfile-каталог."
