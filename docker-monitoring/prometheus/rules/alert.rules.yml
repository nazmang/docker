groups:

###############################################################################
# TARGET AVAILABILITY
###############################################################################
- name: targets
  rules:

  - alert: ServiceDown
    expr: up == 0
    for: 3m
    labels:
      severity: critical
      category: availability
      team: platform
    annotations:
      summary: "Service down: {{ $labels.job }}"
      description: "Instance {{ $labels.instance }} (job={{ $labels.job }}) is not responding."

  - alert: ExporterFlapping
    expr: changes(up[10m]) > 4
    for: 5m
    labels:
      severity: warning
      category: availability
      team: platform
    annotations:
      summary: "Exporter flapping"
      description: "{{ $labels.instance }} exporter is unstable."

###############################################################################
# CPU
###############################################################################
- name: host_cpu
  rules:

  - alert: HighCPULoadWarning
    expr: node_load1 / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 0.8
    for: 5m
    labels:
      severity: warning
      category: resource
      team: platform
    annotations:
      summary: "High CPU load"
      description: "CPU load is {{ printf \"%.2f\" $value }} on {{ $labels.instance }}."

  - alert: HighCPULoadCritical
    expr: node_load1 / count by (instance) (node_cpu_seconds_total{mode="idle"}) > 1.2
    for: 5m
    labels:
      severity: critical
      category: resource
      team: platform
    annotations:
      summary: "CPU saturation"
      description: "CPU load is critically high: {{ printf \"%.2f\" $value }} on {{ $labels.instance }}."

###############################################################################
# MEMORY
###############################################################################
- name: host_memory
  rules:

  - alert: HighMemoryUsageWarning
    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
    for: 5m
    labels:
      severity: warning
      category: resource
      team: platform
    annotations:
      summary: "High memory usage"
      description: "Memory usage is {{ humanize $value }}% on {{ $labels.instance }}."

  - alert: HighMemoryUsageCritical
    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 95
    for: 5m
    labels:
      severity: critical
      category: resource
      team: platform
    annotations:
      summary: "Memory exhaustion risk"
      description: "Memory usage is {{ humanize $value }}% on {{ $labels.instance }}."

  - alert: MemoryPressure
    expr: rate(node_vmstat_pgmajfault[5m]) > 100
    for: 5m
    labels:
      severity: warning
      category: performance
      team: platform
    annotations:
      summary: "Memory pressure detected"
      description: "Major page faults increasing on {{ $labels.instance }}."

###############################################################################
# DISK
###############################################################################
- name: host_disk
  rules:

  - alert: HighDiskUsageWarning
    expr: |
      (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} -
       node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"})
      /
      node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 85
    for: 5m
    labels:
      severity: warning
      category: resource
      team: platform
    annotations:
      summary: "Disk usage high"
      description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ humanize $value }}% full."

  - alert: HighDiskUsageCritical
    expr: |
      (node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} -
       node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"})
      /
      node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} * 100 > 95
    for: 5m
    labels:
      severity: critical
      category: resource
      team: platform
    annotations:
      summary: "Disk almost full"
      description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ humanize $value }}% full."

  - alert: DiskWillFillIn24h
    # The thresholds above catch a disk that is already full; this catches one
    # that is going to be. Added when nas01 came under monitoring on
    # 2026-09-10 -- its /srv/data is 40G and backs both the Swarm and the
    # Kubernetes cluster, so the useful warning is the one that arrives before
    # the filesystem reaches 95%.
    expr: |
      predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
      and
      node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
      /
      node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.30
    for: 30m
    labels:
      severity: warning
      category: resource
      team: platform
    annotations:
      summary: "Disk fills within 24h"
      description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is trending to zero free space within 24 hours."

  - alert: InodeExhaustion
    expr: node_filesystem_files_free / node_filesystem_files < 0.1
    for: 10m
    labels:
      severity: warning
      category: resource
      team: platform
    annotations:
      summary: "Inode exhaustion risk"
      description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is running out of inodes."

  - alert: FilesystemReadonly
    expr: |
      node_filesystem_readonly{
        fstype!~"tmpfs|overlay|aufs|squashfs|ramfs|nsfs",
        mountpoint!~"/run.*|/sys.*|/proc.*|/var/lib/docker/containers.*|/var/lib/kubelet.*"
      } == 1
    labels:
      severity: critical
      category: availability
      team: platform
    annotations:
      summary: "Filesystem became read-only"
      description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is read-only."


###############################################################################
# NETWORK
###############################################################################
- name: host_network
  rules:

  - alert: NetworkErrors
    expr: rate(node_network_receive_errs_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
      category: network
      team: platform
    annotations:
      summary: "Network receive errors"
      description: "Network errors detected on {{ $labels.device }} at {{ $labels.instance }}."

  - alert: NetworkDrops
    # Was `> 0` -- any single dropped packet in five minutes raised a warning.
    # The only interface in the fleet that ever tripped it was debian01's WiFi
    # adapter at 2 packets per minute, which is ordinary background for a
    # wireless NIC (unassociated frames, multicast the card filters out). An
    # alert that fires on two packets a minute teaches people to ignore alerts,
    # and that habit is what makes the next real one invisible.
    #
    # One packet per second, sustained for fifteen minutes, is a fault worth
    # waking up to. Kept deliberately generic rather than excluding wireless
    # interfaces: a wired NIC dropping steadily is exactly what this should
    # catch, and carving out device names would hide it.
    #
    # Measured 2026-09-11 across every scraped host: one interface, 0.033/s.
    # Nothing currently real is masked by this threshold.
    expr: rate(node_network_receive_drop_total[5m]) > 1
    for: 15m
    labels:
      severity: warning
      category: network
      team: platform
    annotations:
      summary: "Network packet drops"
      description: "{{ $labels.device }} на {{ $labels.instance }} теряет {{ $value | printf \"%.1f\" }} пакетов/с при приёме дольше 15 минут."

###############################################################################
# NODE STABILITY
###############################################################################
- name: host_stability
  rules:

  - alert: NodeRebootDetected
    expr: changes(node_boot_time_seconds[15m]) > 0
    labels:
      severity: warning
      category: stability
      team: platform
    annotations:
      summary: "Node reboot detected"
      description: "{{ $labels.instance }} rebooted recently."
