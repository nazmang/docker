###############################################################################
# Alertmanager — последнее звено цепочки оповещения.
#
# До 2026-09-11 за ним не следило ничто: Prometheus его не опрашивал, правил не
# существовало. Это худшая из возможных дыр в мониторинге, потому что отказ
# здесь не виден по определению. Правила продолжают исправно срабатывать,
# уведомления не доходят, и симптомом служит тишина — та же самая тишина, что
# означает «всё в порядке».
#
# В кластерном Prometheus эта часть закрыта давно: kube-prometheus-stack сам
# опрашивает свой Alertmanager и приносит четырнадцать правил. Здесь пришлось
# завести своё, но намеренно немного и без пересечений с тем, что уже есть там.
#
# Чего эти правила НЕ закрывают: одновременную смерть Prometheus и Alertmanager.
# Тогда некому вычислить даже их. Для этого нужен dead man's switch — постоянно
# горящий алерт, уходящий наружу, и внешний наблюдатель, который тревожится,
# когда поток прекратился. У нас для этого есть push-мониторы Uptime Kuma;
# так сделано для debian01. Здесь этого пока нет.
###############################################################################
groups:

- name: alertmanager
  rules:

  - alert: AlertmanagerNotificationsFailing
    # Абсолютный порог, а не доля — и это осознанно, в отличие от правил,
    # которые сегодня пришлось чинить именно за абсолютные пороги. Разница в
    # природе события: потери пакетов и мёртвые строки в таблице происходят
    # постоянно и фоном, поэтому там значим только процент. Неудачная отправка
    # уведомления — событие редкое и единичное, и каждое из них означает, что
    # кто-то не узнал о проблеме. Счётчик растёт только при отказе, так что
    # выражение не может быть истинным «само по себе».
    expr: increase(alertmanager_notifications_failed_total{job="alertmanager"}[15m]) > 0
    for: 5m
    labels:
      severity: critical
      category: alerting
      team: platform
    annotations:
      summary: "Alertmanager не смог доставить уведомление ({{ $labels.integration }})"
      description: "За последние 15 минут {{ $value | printf \"%.0f\" }} неудачных отправок через {{ $labels.integration }}. Алерты срабатывают, но до адресата не доходят. Проверьте доступность ntfy и токен в alertmanager.yml."

  - alert: AlertmanagerConfigReloadFailed
    # Конфигурация не перечиталась — работает предыдущая. Опаснее, чем кажется:
    # правки маршрутизации и получателей молча не применяются, а внешне всё
    # выглядит рабочим.
    expr: alertmanager_config_last_reload_successful{job="alertmanager"} == 0
    for: 10m
    labels:
      severity: critical
      category: alerting
      team: platform
    annotations:
      summary: "Alertmanager не принял свою конфигурацию"
      description: "Последняя попытка перечитать конфигурацию завершилась ошибкой, работает предыдущая версия. Любые изменения маршрутов и получателей сейчас не действуют."

  - alert: AlertmanagerDown
    # absent() нужен отдельно: если цель исчезла из конфигурации или Prometheus
    # её не резолвит, серии up{job="alertmanager"} не станет вовсе, и проверка
    # `== 0` перестанет вычисляться. Молчание снова выглядит как здоровье.
    expr: absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
    for: 5m
    labels:
      severity: critical
      category: alerting
      team: platform
    annotations:
      summary: "Alertmanager недоступен"
      description: "Prometheus не может опросить alertmanager:9093. Пока он лежит, ни одно уведомление не уйдёт — включая это."

###############################################################################
# Dead man's switch.
#
# Всё, что написано выше, разделяет одно слепое пятно: если Prometheus и
# Alertmanager умрут вместе, не останется никого, кто вычислит правило об их
# отсутствии. Тревога не сработает — не потому, что всё хорошо, а потому что
# тревожиться стало некому.
#
# Лечится это только снаружи. Правило ниже горит всегда; ценность у него не в
# срабатывании, а в том, что кто-то замечает, когда оно ПЕРЕСТАЁТ приходить.
# Alertmanager отправляет его каждые пять минут в push-монитор Uptime Kuma,
# который живёт в кластере Kubernetes и потому не зависит ни от чего в этом
# стеке. Маршрут и получатель — в alertmanager.yml, получатель deadmansswitch.
#
# Что эта схема НЕ закрывает: Kuma сама находится в кластере, поэтому для
# кластерного watchdog она наблюдатель неполноценный. Полная независимость
# требует чего-то вне обеих площадок.
###############################################################################

- name: watchdog
  rules:

  - alert: Watchdog
    # vector(1) истинно всегда и не зависит ни от одной цели сбора: правило
    # должно доказывать, что жив сам конвейер вычисления и доставки, а не
    # состояние чего-то ещё.
    expr: vector(1)
    labels:
      severity: none
      category: alerting
      team: platform
    annotations:
      summary: "Сигнал присутствия конвейера оповещения"
      description: "Этот алерт горит постоянно и по замыслу. Он уходит в push-монитор Uptime Kuma каждые пять минут; тревогу поднимает Kuma, когда поток прекращается. Если вы видите его в ntfy — значит сломалась маршрутизация в alertmanager.yml: он не должен туда попадать."
