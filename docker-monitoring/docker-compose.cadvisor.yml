version: "3.8"

services:
  cadvisor:
    # Was nazman/cadvisor:v0.49.1 -- a private image with no Dockerfile in this
    # repository, so it could not be rebuilt, and eleven minor versions behind.
    #
    # It reported zero containers. Not "wrong numbers": the series existed but
    # carried no `name` and no `image` label, only systemd slice paths like
    # /system.slice/ModemManager.service, so every panel filtering on
    # image!="" drew nothing. The cgroups were there all along -- 17
    # docker-*.scope entries under /sys/fs/cgroup/system.slice on dkr01 -- 0.49
    # simply could not identify them under Docker 29 with the containerd
    # snapshotter.
    #
    # Measured on dkr01 on 2026-09-11, same node, same mounts:
    #   v0.49.1  -> 0 series with a name
    #   v0.60.5  -> 17, with real names and images
    #
    # No extra privileges: tested without --privileged and without /dev/kmsg,
    # which cAdvisor's own docs suggest, and the labels appear regardless.
    image: ghcr.io/google/cadvisor:${CADVISOR_TAG:-v0.60.5}
    # --housekeeping_interval: the default is 1s per container. Prometheus
    # scrapes every 15s, so 10s loses nothing and cuts cAdvisor's constant
    # reading of /sys and /var/lib/docker (see the memory note below).
    command:
      - --logtostderr=true
      - --housekeeping_interval=10s
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          # 256M -> 512M on 2026-09-29. At 256M cAdvisor sat at its ceiling
          # (working set 203 MiB on dkr01, 230 MiB on dkr02; the cgroup limit
          # also counts the page cache of everything it reads) and kept
          # evicting its own pages: ~840 major faults/s on dkr01 -- measured
          # per process, practically all of the node's paging -- which is what
          # the MemoryPressure alert on dkr01/dkr02 had been reporting all
          # along. Moving Prometheus off dkr01 freed 420 MB and did not change
          # it; this was the actual cause.
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net
    ports:
      - 8081:8080
    labels:
      org.label-schema.group: "monitoring"

networks:
  monitoring_net:
    name: monitoring_monitoring_net
    external: true
