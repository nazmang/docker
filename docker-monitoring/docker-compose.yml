version: "3.8"

services:
  grafana:
    # Pinned, and not `latest`: the instance ran 10.3.5 for seven months while
    # this line said latest, because the tag is only resolved when the image is
    # pulled. A version in the file is a version someone can reason about.
    #
    # 10.3.5 -> 13.2.1 on 2026-09-11. Verified beforehand against a throwaway
    # 13.2.1 fed these exact dashboards: everything rendered, including the
    # Angular panels 13 no longer supports, which it migrates on load.
    image: grafana/grafana:${GRAFANA_TAG:-13.2.1}
    ports:
      - 3000:3000
    volumes:
      - grafana:/var/lib/grafana
    # Until 2026-09-11 this service mounted the data volume and nothing else:
    # every dashboard existed only inside it, and the files under grafana/ in
    # this repository were read by nobody. Swarm configs take one file each,
    # which is why this list is long -- adding a dashboard means adding it here
    # and in the configs block at the bottom, or it simply will not appear.
    configs:
      - source: gf_provider_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
        mode: 0444
      - source: gf_dash_docker_containers
        target: /etc/grafana/dashboards/Docker/docker-containers.json
        mode: 0444
      - source: gf_dash_docker_host
        target: /etc/grafana/dashboards/Docker/docker-host.json
        mode: 0444
      - source: gf_dash_monitor_services
        target: /etc/grafana/dashboards/Docker/monitor-services.json
        mode: 0444
      - source: gf_dash_certmanager
        target: /etc/grafana/dashboards/Kubernetes/cert-manager.json
        mode: 0444
      - source: gf_dash_k8s
        target: /etc/grafana/dashboards/Kubernetes/k8s-dashboard.json
        mode: 0444
      - source: gf_dash_postgresql
        target: /etc/grafana/dashboards/postgresql-database.json
        mode: 0444
      - source: gf_dash_n8n
        target: /etc/grafana/dashboards/Kubernetes/n8n.json
        mode: 0444
      - source: gf_dash_backups
        target: /etc/grafana/dashboards/Backups.json
        mode: 0444
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      placement:
        constraints:
          - "node.role==worker"
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - monitoring_net
      - gateway_gw_net
    labels:
      org.label-schema.group: "monitoring"

  prometheus:
    image: prom/prometheus:${PROM_TAG:-latest}
    container_name: prometheus
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.role==manager"
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1.5G
    volumes:
      - prometheus_data:/prometheus
    # Config and rules arrive as Swarm configs, not as a bind mount on NFS.
    # Before 2026-09-10 these files lived at /data/prometheus_config and were
    # copied there by hand -- the Jenkins pipeline only ran `docker stack
    # deploy` and never touched them, so git was a hopeful copy rather than the
    # source of truth. That is the same shape of gap that silently deleted
    # OpenSearch's fluentd user, so it is closed here first.
    #
    # Changing a file therefore means a service restart, not `/-/reload`: Swarm
    # configs are immutable, so the name below changes with every commit and
    # the task is recreated with the new content. Metrics gap is a few seconds;
    # the TSDB is untouched.
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
        mode: 0444
      - source: prom_rules_alert
        target: /etc/prometheus/rules/alert.rules.yml
        mode: 0444
      - source: prom_rules_postgres
        target: /etc/prometheus/rules/postgres.alert.rules.yml
        mode: 0444
      - source: prom_rules_jenkins
        target: /etc/prometheus/rules/jenkins.rules.yml
        mode: 0444
      - source: prom_rules_swarm
        target: /etc/prometheus/rules/swarm.rules.yml
        mode: 0444
      # These three were delivered by hand (docker config create + service
      # update) and existed only in the running service, not in this file. A
      # `docker stack deploy` would have removed them -- twenty rules, silently,
      # with the symptom of a missing alert being silence. prometheus.yml has
      # listed all seven rule files since they were written, so the stack was
      # also one redeploy away from failing to load its own configuration.
      - source: prom_rules_backup
        target: /etc/prometheus/rules/backup.rules.yml
        mode: 0444
      - source: prom_rules_veeam
        target: /etc/prometheus/rules/veeam.rules.yml
        mode: 0444
      - source: prom_rules_debian01
        target: /etc/prometheus/rules/debian01.rules.yml
        mode: 0444
    user: 65534:999
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=2d"
      - "--web.enable-lifecycle"
      # Accept metrics pushed by remote agents. debian01 — the home NAS with the
      # ZFS pool and Home Assistant — sits behind NAT on a home network and
      # cannot be scraped from here; opening a port into a home network to reach
      # it would be a worse trade than any amount of resolution. So it runs a
      # Prometheus agent that scrapes itself and writes here instead.
      #
      # The endpoint this opens is /api/v1/write on the same listener that is
      # already published as prom.srvxapp.com — and that is already behind basic
      # auth (verified: it answers 401). No new public surface; the same door
      # now also accepts writes from whoever holds the password.
      - "--web.enable-remote-write-receiver"
      - "--web.external-url=https://prom.srvxapp.com"
      - "--enable-feature=memory-snapshot-on-shutdown"
    ports:
      - 9090:9090
    networks:
      - monitoring_net
      - gateway_gw_net
    labels:
      org.label-schema.group: "monitoring"

  alertmanager:
    image: quay.io/prometheus/alertmanager:${ALERTMGR_TAG:-latest}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - alertmanager:/etc/alertmanager
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    environment:
      - SLACK_URL=${SLACK_URL:-https://hooks.slack.com/services/TOKEN}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-general}
      - SLACK_USER=${SLACK_USER:-alertmanager}
    ports:
      - 9093:9093
    networks:
      - monitoring_net
      - gateway_gw_net
    labels:
      org.label-schema.group: "monitoring"

  # Dashboard over both Alertmanagers -- this stack's and the Kubernetes
  # cluster's. Alertmanager's own UI is a flat list with almost no grouping,
  # which stops being workable the moment more than a handful of alerts fire.
  #
  # Not attached to gateway_gw_net on purpose: karma can create silences, and
  # silencing is exactly what an attacker does before doing something noisy.
  # It listens on the host port only, reachable over the internal network. If
  # it is ever published, it needs authentication in front of it first.
  karma:
    image: ghcr.io/prymitive/karma:${KARMA_TAG:-v0.121}
    command: ["--config.file=/etc/karma/karma.yaml"]
    configs:
      - source: karma_yaml
        target: /etc/karma/karma.yaml
        mode: 0444
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - "node.role==manager"
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: any
    ports:
      - 8082:8080
    networks:
      - monitoring_net
    labels:
      org.label-schema.group: "monitoring"

  # Translates Alertmanager webhooks into readable ntfy notifications. Without
  # it, Alertmanager posts its own JSON and ntfy publishes the payload verbatim
  # as the message text -- verified against the live server, and unreadable on a
  # phone. The cluster runs the same bridge for the same reason.
  #
  # Its config carries the ntfy token, so it lives beside alertmanager.yml under
  # /data and is gitignored for the same reason.
  ntfy-alertmanager:
    image: xenrox/ntfy-alertmanager:${NTFY_AM_TAG:-1.0.1}
    command:
      - "-config"
      - "/etc/ntfy-alertmanager/config.scfg"
    volumes:
      - ntfy_alertmanager:/etc/ntfy-alertmanager
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - monitoring_net
    labels:
      org.label-schema.group: "monitoring"

# Swarm configs are immutable: a given name always carries the content it was
# created with. The version suffix is the git commit, set by Jenkins in .env, so
# every commit that touches these files produces new objects and the running
# task is replaced with them. Deploying by hand? Pass it yourself:
#
#   PROM_CONFIG_VERSION=$(git rev-parse --short HEAD) make deploy-monitoring
#
# Old objects stay behind once nothing references them; `docker config prune`
# is safe to run occasionally.
configs:
  karma_yaml:
    file: ./karma/karma.yaml
    name: karma_yaml_${PROM_CONFIG_VERSION:-manual}
  prometheus_yml:
    file: ./prometheus/prometheus.yml
    name: prometheus_yml_${PROM_CONFIG_VERSION:-manual}
  prom_rules_alert:
    file: ./prometheus/rules/alert.rules.yml
    name: prom_rules_alert_${PROM_CONFIG_VERSION:-manual}
  prom_rules_postgres:
    file: ./prometheus/rules/postgres.alert.rules.yml
    name: prom_rules_postgres_${PROM_CONFIG_VERSION:-manual}
  prom_rules_jenkins:
    file: ./prometheus/rules/jenkins.rules.yml
    name: prom_rules_jenkins_${PROM_CONFIG_VERSION:-manual}
  prom_rules_swarm:
    file: ./prometheus/rules/swarm.rules.yml
    name: prom_rules_swarm_${PROM_CONFIG_VERSION:-manual}
  prom_rules_backup:
    file: ./prometheus/rules/backup.rules.yml
    name: prom_rules_backup_${PROM_CONFIG_VERSION:-manual}
  prom_rules_veeam:
    file: ./prometheus/rules/veeam.rules.yml
    name: prom_rules_veeam_${PROM_CONFIG_VERSION:-manual}
  prom_rules_debian01:
    file: ./prometheus/rules/debian01.rules.yml
    name: prom_rules_debian01_${PROM_CONFIG_VERSION:-manual}
  gf_provider_dashboards:
    file: ./grafana/provisioning/dashboards/dashboards.yml
    name: gf_provider_dashboards_${PROM_CONFIG_VERSION:-manual}
  gf_dash_docker_containers:
    file: ./grafana/dashboards/Docker/docker-containers.json
    name: gf_dash_docker_containers_${PROM_CONFIG_VERSION:-manual}
  gf_dash_docker_host:
    file: ./grafana/dashboards/Docker/docker-host.json
    name: gf_dash_docker_host_${PROM_CONFIG_VERSION:-manual}
  gf_dash_monitor_services:
    file: ./grafana/dashboards/Docker/monitor-services.json
    name: gf_dash_monitor_services_${PROM_CONFIG_VERSION:-manual}
  gf_dash_certmanager:
    file: ./grafana/dashboards/Kubernetes/cert-manager.json
    name: gf_dash_certmanager_${PROM_CONFIG_VERSION:-manual}
  gf_dash_k8s:
    file: ./grafana/dashboards/Kubernetes/k8s-dashboard.json
    name: gf_dash_k8s_${PROM_CONFIG_VERSION:-manual}
  gf_dash_postgresql:
    file: ./grafana/dashboards/postgresql-database.json
    name: gf_dash_postgresql_${PROM_CONFIG_VERSION:-manual}
  gf_dash_n8n:
    file: ./grafana/dashboards/Kubernetes/n8n.json
    name: gf_dash_n8n_${PROM_CONFIG_VERSION:-manual}
  gf_dash_backups:
    file: ./grafana/dashboards/Backups.json
    name: gf_dash_backups_${PROM_CONFIG_VERSION:-manual}

networks:
  monitoring_net:
    driver: overlay
    attachable: true
  gateway_gw_net:
    external: true

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/prometheus_data"
  grafana:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/grafana"
  alertmanager:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/alertmanager"
  ntfy_alertmanager:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "/data/ntfy-alertmanager"
