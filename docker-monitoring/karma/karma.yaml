# karma -- a read-oriented dashboard over Alertmanager.
#
# Alertmanager's own UI shows a flat list and almost no grouping, which is
# workable with three alerts and useless with thirty. karma groups by label,
# shows both Alertmanagers side by side, and can silence from the UI.
#
# Only the Swarm instance for now -- see the note by the servers list.
alertmanager:
  interval: 60s
  servers:
    - name: swarm
      uri: http://alertmanager:9093
      timeout: 10s
      readonly: false
    # The cluster's Alertmanager is NOT listed yet, and the reason is worth
    # keeping: on 2026-09-10 it sat on the public internet with no
    # authentication at all -- readable alerts, and silences creatable by
    # anyone. Basic auth now guards it, which means karma needs credentials to
    # reach it, and credentials do not belong in a Swarm *config* (readable by
    # anyone who can talk to the Docker API). Adding it back is part of moving
    # this file, alertmanager.yml and the ntfy bridge's config.scfg onto Swarm
    # secrets rendered from SOPS at deploy time -- one mechanism, three files.
    # Until then karma covers the Swarm side only.

# Group by what actually distinguishes an incident here.
labels:
  order:
    - severity
    - instance
    - service
  color:
    static:
      - severity
  valueOnly:
    - job

grid:
  sorting:
    order: label
    reverse: false
    label: severity

silenceForm:
  strip:
    # These change between firings of the same problem, so leaving them in a
    # silence makes it match one instance and miss the next.
    labels:
      - job
      - __name__

ui:
  refresh: 30s
  hideFiltersWhenIdle: false
  colorTitlebar: true
  minimalGroupWidth: 420
  alertsPerGroup: 5
  collapseGroups: collapsedOnMobile

listen:
  address: 0.0.0.0
  port: 8080

log:
  level: info
  format: text
