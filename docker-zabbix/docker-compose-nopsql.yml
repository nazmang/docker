services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    # Отключён коллектор wal. Он падал на КАЖДОМ опросе -- в логах та же ошибка
    # с февраля -- и данных не давал вовсе:
    #
    #   pq: could not stat file "pg_wal/000000010000032500000008.deleted":
    #   Permission denied
    #
    # Файлы вида *.deleted -- это особенность PostgreSQL под Windows: когда
    # удалить сегмент WAL не удаётся (файл кем-то открыт, обычно антивирусом),
    # сервер переименовывает его вместо удаления. Коллектор пытается снять с
    # него stat и получает отказ. Пока такой файл лежит в pg_wal, ошибка будет
    # повторяться, сколько прав ни выдай.
    #
    # Каждая такая попытка стоила от 0.1 до 3.3 секунды при таймауте опроса в
    # 20 секунд -- то есть съедала часть бюджета ради нуля метрик.
    command:
      - --no-collector.wal
    ports:
      - 9187:9187
    networks:
      - zabbix-net
      - monitoring_net
    env_file:
      - start.env
    environment:
      DATA_SOURCE_USER_FILE: /run/secrets/POSTGRES_USER
      DATA_SOURCE_PASS_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    # Экспортер дважды за сутки зависал: процесс жив, порт открыт, но на
    # /metrics не отвечает вовсе. Swarm такую задачу считает здоровой -- она же
    # не завершилась, -- поэтому без проверки он её не тронет, и оба раза
    # чинил человек.
    #
    # Нормальный опрос занимает 3.3 секунды, отсюда таймаут 15: запас есть, но
    # зависание распознаётся. Три неудачи по 30 секунд -- около полутора минут
    # до пересоздания задачи вместо простоя до тех пор, пока кто-нибудь
    # не заметит.
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "--timeout=10", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.platform.arch==x86_64
          - node.role == worker
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1.5"
          memory: 1G
    env_file:
      - start.env
    environment:
      - ZBX_SOURCEIP=0.0.0.0
      - ZBX_STARTPOLLERS=20
      - ZBX_STARTPREPROCESSORS=10
      - ZBX_STARTLLDPROCESSORS=10
      - ZBX_STARTESCALATORS=5
      - ZBX_STARTTIMERS=5
      - ZBX_STARTALERTERS=5
      - ZBX_STARTDBSYNCERS=10
      - ZBX_STARTDISCOVERERS=5
      - ZBX_STARTHTTPPOLLERS=5
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
      - gw_net
    depends_on:
      - postgres-zabbix
    stop_grace_period: 30s
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.all.secure_redirects=0
      - net.ipv4.conf.all.send_redirects=0
      # База живёт на psvc, за интернетом. Публичный адрес там выдаётся
      # Hetzner по DHCP с арендой ровно 12 часов, и продление аренды каждый
      # раз проваливается: unicast RENEW к серверу не доходит, Windows
      # пишет в журнал 0x79 (таймаут). Аренда доживает до конца, и в момент
      # истечения адрес снимается с интерфейса примерно на шесть секунд.
      #
      # Шести секунд достаточно, чтобы убить все установленные соединения.
      # Причём убить молча: адреса больше нет, ответить некому, ни RST, ни
      # FIN не придёт. Со стороны Zabbix соединение выглядит живым.
      #
      # Дальше начинается самое дорогое. Каждый процесс сервера, который
      # ходит в базу, повисает на таком сокете ровно на шестнадцать минут:
      # configuration syncer, history syncer, task manager, escalator,
      # alert manager, alert syncer, availability manager, service manager,
      # trigger housekeeper. Поллеры при этом работают как ни в чём не
      # бывало -- они в базу не ходят, и по этому расслоению причина и
      # нашлась: нагрузка так себя не ведёт.
      #
      # Шестнадцать минут -- это не совпадение, это tcp_retries2=15 по
      # умолчанию: 924 секунды до того, как ядро признает соединение
      # мёртвым. Всё это время процессы числятся занятыми на 100%, и десять
      # триггеров вида avg(...,10m)>75 исправно шлют по десять уведомлений
      # на каждый эпизод. За месяц -- 846 событий, все до одного ложные.
      #
      # 8 попыток -- это около 100 секунд. Среднее за десять минут выходит
      # примерно 20%, то есть ниже порога: шторм прекращается сам собой, без
      # правки триггеров. И, что важнее, сервер возвращается к работе через
      # полторы минуты вместо шестнадцати.
      #
      # Сам обрыв лечится на psvc -- переводом интерфейса на статический
      # адрес, тогда продлевать будет нечего. Эти параметры остаются нужными
      # и после: сервер не должен висеть шестнадцать минут на любом обрыве,
      # какой бы ни была его причина. Правильное же решение -- убрать базу
      # из-за интернета.
      - net.ipv4.tcp_retries2=8
      # Держать соединения проверенными, пока они простаивают: обрыв
      # обнаруживается за ~90 секунд, а не в момент следующей записи.
      - net.ipv4.tcp_keepalive_time=60
      - net.ipv4.tcp_keepalive_intvl=10
      - net.ipv4.tcp_keepalive_probes=3
    labels:
      com.zabbix.description: "Zabbix server with PostgreSQL database support"
      com.zabbix.company: "Zabbix LLC"
      com.zabbix.component: "zabbix-server"
      com.zabbix.dbtype: "pgsql"
      com.zabbix.os: "alpine"
    # logging:
    #   driver: gelf
    #   options:
    #     gelf-address: udp://gw.comintern.local:12201
    #     tag: zabbix

  zabbix-agent2:
    image: zabbix/zabbix-agent:alpine-6.4-latest
    ports:
      - target: 10050
        published: 10050
        protocol: tcp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # - /etc/zabbix:/etc/zabbix/zabbix_agentd.d:ro
    tmpfs: /tmp
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 60s
      placement:
        constraints:
          - node.platform.arch==x86_64
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    privileged: true
    pid: "host"
    networks:
      - zabbix-net
    stop_grace_period: 5s
    labels:
      com.zabbix.description: "Zabbix agent 2"
      com.zabbix.company: "Zabbix LLC"
      com.zabbix.component: "zabbix-agent2"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:6.4-alpine-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Kiev
    env_file:
      - start.env
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.platform.arch==x86_64
          - node.role == manager         
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.7"
          memory: 700M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 20s
      retries: 5
      start_period: 60s
    stop_grace_period: 10s
    sysctls:
      - net.core.somaxconn=65535
    ports:
      - target: 8443
        published: 18443
        mode: ingress
      - target: 8080
        published: 18080
        mode: ingress
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net
      - gw_net
    labels:
      com.zabbix.description: "Zabbix frontend on Nginx web-server with PostgreSQL database support"
      com.zabbix.company: "Zabbix LLC"
      com.zabbix.component: "zabbix-frontend"
      com.zabbix.webserver: "nginx"
      com.zabbix.dbtype: "pgsql"
      com.zabbix.os: "alpine"

networks:
  zabbix-net:
    driver: overlay
    driver_opts:
      com.docker.network.enable_ipv6: "false"
  gw_net:
    external: true
    name: gateway_gw_net
  monitoring_net:
    external: true
    name: monitoring_monitoring_net

secrets:
  POSTGRES_USER:
    file: ./.POSTGRES_USER
    name: POSTGRES_USER_v${CONF_VERSION}
  POSTGRES_PASSWORD:
    file: ./.POSTGRES_PASSWORD
    name: POSTGRES_PASSWORD_v${CONF_VERSION}

configs:
  postgres_config:
    # external: true
    file: ./postgresql.conf
    name: postgres_config_v${CONF_VERSION}
