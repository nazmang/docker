# Prometheus in agent mode on debian01.
#
# This host cannot be scraped: it is behind NAT on a home network, and the
# monitoring stack is in another datacentre. So it scrapes itself and pushes.
# Agent mode stores nothing locally beyond a small write-ahead log — no TSDB,
# no queries, no UI worth exposing.
#
# The listener is bound to loopback for that reason: nothing here needs to be
# reachable, not even from the LAN.
global:
  scrape_interval: 30s
  external_labels:
    # Every series pushed from here carries these, which is how alerts and
    # dashboards tell this machine apart from the Hetzner hosts. Without them
    # the metrics would silently blend into the cluster's.
    site: home
    host: debian01

scrape_configs:
  - job_name: debian01
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: debian01

remote_write:
  - url: https://prom.srvxapp.com/api/v1/write
    basic_auth:
      username: REMOTE_WRITE_USER
      password_file: /etc/prometheus/rw_password
    # A home connection drops. The queue keeps a couple of hours of samples and
    # replays them when the link returns, so an evening without internet leaves
    # a gap of nothing rather than a gap in the data.
    queue_config:
      capacity: 10000
      max_shards: 5
      max_samples_per_send: 2000
      batch_send_deadline: 30s
      min_backoff: 1s
      max_backoff: 5m
