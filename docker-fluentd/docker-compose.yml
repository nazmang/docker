version: "3.8"

services:
  fluentd:
    image: ${IMAGE}
    build:
      context: ./fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - fluentd-data:/fluentd/log
      - fluentd-config:/fluentd/etc/
    configs:
      - source: fluentd-config
        target: /fluentd/etc/fluent.conf
    environment:
      - FLUENT_UID=0
      - OS_PASSWORD=${OS_PASSWORD}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker

configs:
  fluentd-config:
    file: ./fluentd/fluent.conf
    name: fluentd-config_v${CONF_VERSION}
volumes:
  # Plain local volume on the node (not NFS): fluentd file buffers must not
  # live on a network filesystem. A task moved to another worker starts with
  # an empty buffer there; the old node keeps its chunks.
  # Mounted over /fluentd/log, which the image owns as fluent (uid 999): a new
  # volume copies that owner. A volume over a path missing in the image is
  # created root-owned and fluentd cannot write (16.10.2026, #80).
  fluentd-data:
    driver: local
  fluentd-config:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "${FLUEND_CONFIG_PATH}"
