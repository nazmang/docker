<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# ------------------------
# NGINX ACCESS
# ------------------------

<filter nginx.access>
  @type record_transformer
  enable_ruby true

  <record>
    path ${record["uri"].split("?")[0] rescue record["uri"]}
    query_string ${record["uri"].include?("?") ? record["uri"].split("?")[1] : nil}
  </record>
</filter>

<filter nginx.access>
  @type record_transformer
  enable_ruby true

  <record>
    query_params ${record["query_string"] ? URI.decode_www_form(record["query_string"]).to_h : {}}
  </record>
</filter>

<filter nginx.access>
  @type record_transformer
  enable_ruby true

  <record>
    status ${record["status"].to_i rescue nil}
    bytes ${record["bytes"].to_i rescue nil}
  </record>
</filter>

<filter nginx.access>
  @type record_transformer
  remove_keys query_string
</filter>

# ------------------------
# OUTPUTS
# ------------------------

<match nginx.access>
  @type opensearch

  host 10.163.11.105
  port 9200
  scheme https

  user fluentd
  password "#{ENV['OS_PASSWORD']}"

  logstash_format true
  logstash_prefix nginx-access

  include_tag_key true
  tag_key @log_name

  pipeline geoip_pipeline

  ssl_verify false
  request_timeout 30s
  reconnect_on_error true
  log_os_400_reason true

  # File buffer on the node's local disk, retried without dropping:
  # 16.10.2026 a memory buffer gave up after 18 retries and dropped 72k
  # nginx-access records. When the limit is hit, the oldest chunk goes first.
  <buffer>
    @type file
    path /fluentd/log/buffer/nginx-access
    flush_interval 10s
    chunk_limit_size 8MB
    total_limit_size 1GB
    retry_forever true
    retry_max_interval 5m
    overflow_action drop_oldest_chunk
  </buffer>
</match>

<match nginx.error>
  @type opensearch

  host 10.163.11.105
  port 9200
  scheme https

  user fluentd
  password "#{ENV['OS_PASSWORD']}"

  logstash_format true
  logstash_prefix nginx-error

  include_tag_key true
  tag_key @log_name

  ssl_verify false
  request_timeout 30s
  reconnect_on_error true
  log_os_400_reason true

  # Same buffer as nginx.access.
  <buffer>
    @type file
    path /fluentd/log/buffer/nginx-error
    flush_interval 10s
    chunk_limit_size 8MB
    total_limit_size 1GB
    retry_forever true
    retry_max_interval 5m
    overflow_action drop_oldest_chunk
  </buffer>
</match>

<match syslog.general>
  @type opensearch

  host 10.163.11.105
  port 9200
  scheme https

  user fluentd
  password "#{ENV['OS_PASSWORD']}"

  ssl_verify false
  log_os_400_reason true

  # Same buffer as nginx.access.
  <buffer>
    @type file
    path /fluentd/log/buffer/syslog-general
    flush_interval 10s
    chunk_limit_size 8MB
    total_limit_size 1GB
    retry_forever true
    retry_max_interval 5m
    overflow_action drop_oldest_chunk
  </buffer>
</match>
